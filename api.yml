openapi: 3.0.3
info:
  title: Orders API
  version: "1.0"
  description: >
    PROVISIONAL CONTRACT — drafted from OrderService.cs
    (GetOrderForCustomer, GetTotalSpend, UpdateOrderStatus) because no
    official orders-api.yaml was provided. Replace with official version
    if one arrives later

servers:
  - url: https://localhost:5001
    description: Local dev (ASP.NET Core default HTTPS port — to adjust accordingly

paths:
  /api/orders:
    get:
      operationId: getOrdersForCustomer
      summary: Get a customer's orders filtered by status
      description: Mirrors OrderService.GetOrderForCustomer(customerId, status).
      parameters:
        - name: customerId
          in: query
          required: true
          schema:
            type: integer
        - name: status
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: Orders matching the customer + status filter (empty array if none)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '400':
          description: Missing/invalid customerId or status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/customers/{customerId}/total-spend:
    get:
      operationId: getTotalSpend
      summary: Get a customer's total spend across Completed orders
      description: Mirrors OrderService.GetTotalSpend(customerId) — sums Total across status="Completed" orders.
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Total spend
          content:
            application/json:
              schema:
                type: object
                required: [customerId, totalSpend]
                properties:
                  customerId:
                    type: integer
                  totalSpend:
                    type: number
                    format: decimal
        '404':
          description: Customer has no orders / does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/orders/{orderId}/status:
    patch:
      operationId: updateOrderStatus
      summary: Update an order's status
      description: Mirrors OrderService.UpdateOrderStatus(orderId, newStatus).
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/OrderStatus'
      responses:
        '204':
          description: Status updated successfully — no content returned
        '400':
          description: Invalid status value or malformed request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    OrderStatus:
      type: string
      description: >
        Only "Completed" and "Pending" were previously discussed. The remaining values are inferred
        from researched typical order lifecycle.
      enum:
        - Pending
        - Processing
        - Shipped
        - Completed
        - Cancelled
        - Refunded

    Order:
      type: object
      description: Matches OrderService.Order exactly.
      required: [orderId, customerId, total, status]
      properties:
        orderId:
          type: integer
        customerId:
          type: integer
        total:
          type: number
          format: decimal
        status:
          $ref: '#/components/schemas/OrderStatus'

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string